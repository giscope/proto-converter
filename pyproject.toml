[project]
name = "proto-converter"
version = "0.1.0"
description = "Declarative YAML-driven JSON ↔ Protobuf converter with factory pattern support"
requires-python = ">=3.11"
dependencies = [
    "protobuf>=5.0.0",
    "pyyaml>=6.0",
    "simpleeval>=1.0.0",
    "python-dateutil>=2.8.0",
    "pytz>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proto_converter"]
